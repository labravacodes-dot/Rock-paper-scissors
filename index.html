<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors: Road to Ninja</title>
    <!-- CSS stylesheet linked here -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Music (Invisible Player) -->
    <audio id="bgm" src="bgm.mp3" loop></audio>
    <div class="game-container">
        
        <!-- Terminal Language Selector Bar -->
        <div class="terminal-lang-bar">
          <span class="prompt-symbol">$ set-lang:</span>
          <button onclick="changeLanguage('en')">EN</button>
          <button onclick="changeLanguage('es')">ES</button>
          <button onclick="changeLanguage('ru')">RU</button>
          <button onclick="changeLanguage('ja')">JA</button>
          <button onclick="changeLanguage('ko')">KO</button>
          <button onclick="changeLanguage('zh')">ZH</button>
          <button onclick="changeLanguage('de')">DE</button>
        </div>

        <!-- Music Toggle Button placed right here! -->
        <button id="music-btn" class="music-toggle">🎵 Music playing</button>

        <h1>🥷 Rock Paper Scissors: Shinobi Edition: Road to Ninja 🤌</h1>
        
        <!-- Action Buttons -->
        <div class="move-selection">
            <button id="rock">🪨 Rock (Rokku)</button>
            <button id="paper">📜 Paper (Kami)</button>
            <button id="scissors">✂️ Scissors (Hasami)</button>
        </div>

        <!-- Battle Cards Arena -->
        <div class="battle-arena">
            <div class="choice-card">
                <h3>Shinobi (You)</h3>
                <p id="player-choice-display">—</p>
            </div>
            <div class="vs">VS</div>
            <div class="choice-card">
                <h3>Your Next Door Sparring Partner That Always Comes Back Asking For More</h3>
                <p id="computer-choice-display">—</p>
            </div>
        </div>

        <!-- Scoreboard -->
        <div class="scoreboard">
            <div class="score">Player: <span id="human-score">0</span></div>
            <div class="score">Computer: <span id="computer-score">0</span></div>
        </div>

        <!-- Dialogue / Results Box -->
        <div class="dialogue-box">
            <p id="round-result">Choose your Ninpo technique to begin the duel!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
